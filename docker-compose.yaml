services:
  database:
    image: postgres:latest
    container_name: kanban_db 
    environment:
      POSTGRES_USER: admin 
      POSTGRES_PASSWORD: supersecretpass123 
      POSTGRES_DB: main_database 
    ports:
      - "5432:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
    restart: unless-stopped